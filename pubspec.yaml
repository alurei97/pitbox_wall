name: pitbox_wall
description: "Pitbox Wall — F1 race companion: standings, bump chart, race results, and an AI assistant."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  retrofit: ^4.9.2
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.8
  drift_dev: ^2.34.5
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/tracks/
